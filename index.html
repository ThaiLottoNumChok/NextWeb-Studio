<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextWeb-Studio - สถานีรีวิวหนังและซีรีส์</title>
    
    <!-- Open Graph (OG Tags) สำหรับพรีวิวสวยๆ บน Facebook -->
    <meta property="og:title" content="NextWeb-Studio - สถานีรีวิวหนังและซีรีส์สไตล์คอหนัง">
    <meta property="og:description" content="สถานีรีวิวหนัง ซีรีส์ และป้ายยาไอเทมเด็ด คัดเน้นๆ เพื่อคอหนังตัวจริง กดดูรีวิวและช้อปสินค้ากันได้เลย!">
    <meta property="og:image" content="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1000&auto=format&fit=crop">
    <meta property="og:url" content="https://thailottonumchok.github.io/NextWeb-Studio/">
    <meta property="og:type" content="website">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-color: #e50914;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background-color: #000;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
        }
        header h1 {
            margin: 0;
            color: var(--primary-color);
            font-size: 24px;
        }
        header p {
            margin: 5px 0 0;
            color: var(--text-muted);
            font-size: 14px;
        }
        /* ซ่อนแผงแอดมินไว้ก่อน */
        .admin-panel {
            display: none;
            background-color: #1a1a1a;
            border: 2px dashed var(--primary-color);
            padding: 15px;
            margin: 15px auto;
            max-width: 800px;
            border-radius: 8px;
        }
        .admin-panel h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 16px;
        }
        .admin-panel input, .admin-panel textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .admin-panel button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .container {
            padding: 15px;
            max-width: 800px;
            margin: auto;
        }
        .post-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .post-content {
            padding: 15px;
        }
        .post-content h2 {
            margin-top: 0;
            font-size: 20px;
            color: #fff;
        }
        .post-content p {
            color: var(--text-muted);
            font-size: 14px;
        }
        .btn-store {
            display: block;
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn-delete {
            background: #333;
            color: #ff5555;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }
        .admin-toggle-btn {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 11px;
            text-decoration: underline;
            margin-top: 10px;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 12px;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

    <header>
        <h1>NextWeb-Studio</h1>
        <p>สถานีรีวิวหนัง ซีรีส์ และป้ายยาไอเทมเด็ด</p>
    </header>

    <div class="admin-panel" id="adminPanel">
        <h3>🎛️ จัดผังรายการรีวิวหนัง (ระบบหลังบ้านแอดมิน)</h3>
        <input type="text" id="ytUrl" placeholder="วางลิงก์ยูทูป เช่น https://youtu.be/xxxx หรือรหัสคลิป">
        <input type="text" id="postTitle" placeholder="ชื่อหัวข้อรีวิวหนัง / ชื่อช่อง">
        <textarea id="postDesc" rows="2" placeholder="เนื้อหาย่อ หรือคำโปรยรีวิวสไตล์เรา..."></textarea>
        <button onclick="addPost()">➕ เพิ่มเข้ารายการสถานีทันที</button>
    </div>

    <div class="container" id="postsContainer">
        <!-- รายการจะถูกโหลดมาแสดงที่นี่อัตโนมัติ -->
    </div>

    <footer>
        &copy; 2026 NextWeb-Studio. All Rights Reserved.
        <br>
        <button class="admin-toggle-btn" onclick="checkAdminPassword()">⚙️ เข้าสู่ระบบหลังบ้านแอดมิน</button>
    </footer>

    <script>
        // ตั้งค่าคลิปเริ่มต้นถาวรตรงนี้ (ใส่คลิป Avengers หรือคลิปที่ต้องการไว้ได้เลยครับ)
        let posts = JSON.parse(localStorage.getItem('nextweb_posts')) || [
            {
                url: "https://youtu.be/S_xWz7c8z80", 
                title: "แกะตัวอย่างหนัง",
                desc: "แกะตัวอย่างหนัง"
            }
        ];

        function renderPosts() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '';

            posts.forEach((post, index) => {
                let videoId = post.url;
                if (videoId.includes('youtu.be/')) {
                    videoId = videoId.split('youtu.be/')[1].split('?')[0];
                } else if (videoId.includes('watch?v=')) {
                    videoId = videoId.split('watch?v=')[1].split('&')[0];
                } else if (videoId.includes('embed/')) {
                    videoId = videoId.split('embed/')[1].split('?')[0];
                }

                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div class="video-container">
                        <iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>
                    </div>
                    <div class="post-content">
                        <h2>${post.title}</h2>
                        <p>${post.desc}</p>
                        <a href="https://thailottonumchok.github.io/Shopee-Store-Pro/" class="btn-store" target="_blank">🛒 ช้อปอุปกรณ์ดูหนัง & สินค้าแนะนำของพวกเรา</a>
                        <button class="btn-delete" onclick="deletePost(${index})">🗑️ ลบรายการนี้ออก</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function addPost() {
            const url = document.getElementById('ytUrl').value.trim();
            const title = document.getElementById('postTitle').value.trim();
            const desc = document.getElementById('postDesc').value.trim();

            if (!url || !title) {
                alert('กรุณากรอกลิงก์ยูทูปและชื่อหัวข้อรีวิวด้วยครับพี่!');
                return;
            }

            posts.unshift({ url, title, desc });
            localStorage.setItem('nextweb_posts', JSON.stringify(posts));

            document.getElementById('ytUrl').value = '';
            document.getElementById('postTitle').value = '';
            document.getElementById('postDesc').value = '';

            renderPosts();
            alert('เพิ่มเข้ารายการสถานีเรียบร้อยแล้วครับ!');
        }

        function deletePost(index) {
            if (confirm('ต้องการลบรายการรีวิวนี้ออกจากสถานีใช่ไหมครับ?')) {
                posts.splice(index, 1);
                localStorage.setItem('nextweb_posts', JSON.stringify(posts));
                renderPosts();
            }
        }

        function checkAdminPassword() {
            let pass = prompt('กรุณากรอกรหัสผ่านแอดมิน:');
            if (pass === '44104545') {
                const panel = document.getElementById('adminPanel');
                if (panel.style.display === 'block') {
                    panel.style.display = 'none';
                    alert('ปิดระบบหลังบ้านแล้วครับ');
                } else {
                    panel.style.display = 'block';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    alert('ยินดีต้อนรับท่านประธาน! เปิดระบบหลังบ้านสำเร็จ');
                }
            } else if (pass !== null) {
                alert('รหัสผ่านไม่ถูกต้องครับ!');
            }
        }

        renderPosts();
    </script>
</body>
</html>

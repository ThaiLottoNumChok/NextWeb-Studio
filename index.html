<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextWeb-Studio - รีวิวหนังและซีรีส์สไตล์คอหนัง</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-color: #e50914; /* โทนสีแดงสไตล์สตรีมมิ่ง */
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background-color: #000;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
        }
        header h1 {
            margin: 0;
            color: var(--primary-color);
            font-size: 24px;
        }
        header p {
            margin: 5px 0 0;
            color: var(--text-muted);
            font-size: 14px;
        }
        .container {
            padding: 15px;
            max-width: 800px;
            margin: auto;
        }
        .post-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* อัตราส่วน 16:9 */
            height: 0;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .post-content {
            padding: 15px;
        }
        .post-content h2 {
            margin-top: 0;
            font-size: 20px;
        }
        .post-content p {
            color: var(--text-muted);
            font-size: 14px;
        }
        .btn-store {
            display: block;
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn-store:hover {
            background-color: #f40612;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 12px;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

    <header>
        <h1>NextWeb-Studio</h1>
        <p>สถานีรีวิวหนัง ซีรีส์ และป้ายยาไอเทมเด็ด</p>
    </header>

    <div class="container">
        <!-- บทความรีวิวเรื่องที่ 1 -->
        <div class="post-card">
            <!-- ตัวอย่างวิดีโอ Trailer จาก YouTube แบบถูกลิขสิทธิ์ (Embed) -->
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
            </div>
            <div class="post-content">
                <h2>รีวิวจัดเต็ม: หนังใหม่กระแสแรงประจำสัปดาห์</h2>
                <p>สรุปความรู้สึกหลังดูแบบเข้าใจง่าย สไตล์เราเอง ไม่สปอยล์เนื้อหาสำคัญ พร้อมชวนคอหนังมาวิเคราะห์ไปด้วยกัน...</p>
                
                <!-- ปุ่มลิงก์ข้ามไปเว็บสโตร์ส่วนตัว -->
                <a href="https://thailottonumchok.github.io/Shopee-Store-Pro/" class="btn-store" target="_blank">🛒 ช้อปอุปกรณ์ดูหนัง & สินค้าแนะนำของพวกเรา</a>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 NextWeb-Studio. All Rights Reserved.
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NextWeb-Studio - สถานีรีวิวหนัง ซีรีส์ & TikTok Reels</title>
    <!-- Open Graph (OG Tags) สำหรับพรีวิวสวยๆ บน Facebook & Social -->
    <meta property="og:title" content="NextWeb-Studio - สถานีรีวิวหนัง ซีรีส์ & TikTok Reels สไตล์คอหนัง">
    <meta property="og:description" content="สถานีรีวิวหนัง ซีรีส์ และป้ายยาไอเทมเด็ด พร้อม TikTok Reels คัดเน้นๆ เพื่อคอหนังตัวจริง!">
    <meta property="og:image" content="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1000&auto=format&fit=crop">
    <meta property="og:url" content="https://thailottonumchok.github.io/NextWeb-Studio/">
    <meta property="og:type" content="website">
    
    <!-- สคริปต์ทางการของ TikTok สำหรับดึง Embed วิดีโออัตโนมัติ -->
    <script async src="https://www.tiktok.com/embed.js"></script>

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-color: #e50914;
            --tiktok-color: #ff0050;
            --tiktok-cyan: #00f2fe;
            --text-color: #ffffff;
            --text-muted: #b3b3b3;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        header {
            background-color: #000;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--primary-color);
        }
        header h1 {
            margin: 0;
            color: var(--primary-color);
            font-size: 24px;
        }
        header p {
            margin: 5px 0 0;
            color: var(--text-muted);
            font-size: 14px;
        }
        /* เมนูกรองประเภทวิดีโอ */
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 15px auto 0;
            max-width: 800px;
            padding: 0 15px;
        }
        .filter-btn {
            background: #2a2a2a;
            color: var(--text-color);
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .filter-btn.active {
            background: var(--primary-color);
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(229, 9, 20, 0.5);
        }
        .filter-btn.tiktok.active {
            background: linear-gradient(45deg, var(--tiktok-color), var(--tiktok-cyan));
            border-color: transparent;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }
        /* ซ่อนแผงแอดมินไว้ก่อน */
        .admin-panel {
            display: none;
            background-color: #1a1a1a;
            border: 2px dashed var(--primary-color);
            padding: 15px;
            margin: 15px auto;
            max-width: 800px;
            border-radius: 8px;
        }
        .admin-panel h3 {
            margin-top: 0;
            color: var(--primary-color);
            font-size: 16px;
        }
        .admin-panel select, .admin-panel input, .admin-panel textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .admin-panel button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 5px;
            margin-bottom: 5px;
        }
        .btn-ai-voice {
            background-color: #2196F3 !important;
        }
        .container {
            padding: 15px;
            max-width: 800px;
            margin: auto;
        }
        .post-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            position: relative;
        }
        /* Container วิดีโอ YouTube (16:9) */
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            background: #000;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        /* Container สำหรับ TikTok Embed Official */
        .tiktok-embed-wrapper {
            display: flex;
            justify-content: center;
            background: #000;
            padding: 10px 0;
            overflow: hidden;
        }
        .post-content {
            padding: 15px;
        }
        .post-content h2 {
            margin-top: 0;
            font-size: 20px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: normal;
        }
        .badge-yt {
            background: var(--primary-color);
            color: #fff;
        }
        .badge-tiktok {
            background: linear-gradient(45deg, var(--tiktok-color), #000);
            border: 1px solid var(--tiktok-cyan);
            color: #fff;
        }
        .post-content p {
            color: var(--text-muted);
            font-size: 14px;
        }
        .btn-store {
            display: block;
            background-color: var(--primary-color);
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
        }
        .btn-delete {
            background: #333;
            color: #ff5555;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 10px;
        }
        .admin-toggle-btn {
            background: none;
            border: none;
            color: #555;
            cursor: pointer;
            font-size: 11px;
            text-decoration: underline;
            margin-top: 10px;
        }
        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 12px;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>
    <header>
        <h1>NextWeb-Studio</h1>
        <p>สถานีรีวิวหนัง ซีรีส์ และ TikTok Reels เด็ดๆ</p>
    </header>

    <div class="filter-bar">
        <button class="filter-btn active" onclick="filterPosts('all', this)">🎬 ทั้งหมด</button>
        <button class="filter-btn" onclick="filterPosts('youtube', this)">▶️ YouTube</button>
        <button class="filter-btn tiktok" onclick="filterPosts('tiktok', this)">🎵 TikTok Reels</button>
    </div>

    <div class="admin-panel" id="adminPanel">
        <h3>🎛️ จัดผังรายการ & ระบบเสียงพากย์ AI ฟรี</h3>
        <select id="mediaType">
            <option value="youtube">▶️ YouTube Video (16:9)</option>
            <option value="tiktok">🎵 TikTok Reel / Video (วางลิงก์จากแอปได้เลย)</option>
        </select>
        <input type="text" id="ytUrl" placeholder="วางลิงก์วิดีโอ (YouTube หรือ ลิงก์จากแอป TikTok เช่น vt.tiktok.com/xxxx)">
        <input type="text" id="postTitle" placeholder="ชื่อหัวข้อรีวิวหนัง / ชื่อคลิป">
        <textarea id="postDesc" rows="3" placeholder="พิมพ์บทพากย์หนังตรงนี้ เพื่อกดฟังเสียง AI หรือเพิ่มเข้ารายการ..."></textarea>
        <button onclick="addPost()">➕ เพิ่มเข้ารายการสถานีทันที</button>
        <button class="btn-ai-voice" onclick="playAIVoice()">🎙️ ฟังเสียงพากย์ AI (ฟรี)</button>
        <button onclick="stopAIVoice()" style="background-color: #555;">⏹️ หยุดเสียง</button>
    </div>

    <div class="container" id="postsContainer">
        <!-- รายการจะถูกโหลดมาแสดงที่นี่อัตโนมัติ -->
    </div>

    <footer>
        &copy; 2026 NextWeb-Studio. All Rights Reserved.
        <br>
        <button class="admin-toggle-btn" onclick="checkAdminPassword()">⚙️ เข้าสู่ระบบหลังบ้านแอดมิน</button>
    </footer>

    <script>
        let currentFilter = 'all';
        let posts = JSON.parse(localStorage.getItem('nextweb_posts')) || [
            {
                type: "youtube",
                url: "https://youtu.be/S_xWz7c8z80",
                title: "แกะตัวอย่างหนัง",
                desc: "4 ปีเต็มๆ ที่ทุกคนในโลก... แม้กระทั่งคนรักและเพื่อนสนิท ลืมชื่อและตัวตนของ 'ปีเตอร์ ปาร์คเกอร์' ไปจนหมดสิ้น!"
            }
        ];

        function renderPosts() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '';
            
            const filteredPosts = posts.filter(post => {
                if (currentFilter === 'all') return true;
                return (post.type || 'youtube') === currentFilter;
            });

            if (filteredPosts.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#777; margin: 40px 0;">ยังไม่มีรายการในหมวดหมู่นี้ครับ</p>';
                return;
            }

            filteredPosts.forEach((post, index) => {
                const pType = post.type || 'youtube';
                const card = document.createElement('div');
                card.className = 'post-card';
                
                let mediaHtml = '';
                
                if (pType === 'tiktok') {
                    // รองรับทั้งลิงก์สั้น vt.tiktok.com และลิงก์ยาวแบบเต็ม
                    mediaHtml = `
                        <div class="tiktok-embed-wrapper">
                            <blockquote class="tiktok-embed" cite="${post.url}" data-video-id="" style="max-width: 605px;min-width: 325px;">
                                <section>
                                    <a target="_blank" title="TikTok" href="${post.url}">กำลังโหลดคลิป TikTok...</a>
                                </section>
                            </blockquote>
                        </div>
                    `;
                } else {
                    let videoId = post.url;
                    if (videoId.includes('youtu.be/')) {
                        videoId = videoId.split('youtu.be/')[1].split('?')[0];
                    } else if (videoId.includes('watch?v=')) {
                        videoId = videoId.split('watch?v=')[1].split('&')[0];
                    } else if (videoId.includes('embed/')) {
                        videoId = videoId.split('embed/')[1].split('?')[0];
                    }
                    mediaHtml = `
                        <div class="video-container">
                            <iframe src="https://www.youtube.com/embed/${videoId}" allowfullscreen></iframe>
                        </div>
                    `;
                }

                const badgeHtml = pType === 'tiktok' 
                    ? '<span class="badge badge-tiktok">TikTok Reel</span>' 
                    : '<span class="badge badge-yt">YouTube</span>';

                card.innerHTML = `
                    ${mediaHtml}
                    <div class="post-content">
                        <h2>${post.title} ${badgeHtml}</h2>
                        <p>${post.desc}</p>
                        <a href="https://thailottonumchok.github.io/Shopee-Store-Pro/" class="btn-store" target="_blank">🛒 ช้อปอุปกรณ์ดูหนัง & สินค้าแนะนำของพวกเรา</a>
                        <button class="btn-delete" onclick="deletePost(${index})">🗑️ ลบรายการนี้ออก</button>
                    </div>
                `;
                container.appendChild(card);
            });

            // โหลดสคริปต์ TikTok Embed เพื่อแปลงบล็อกข้อความให้กลายเป็นวิดีโอทันที
            if (window.tiktokEmbed) {
                window.tiktokEmbed.load();
            } else {
                const script = document.createElement('script');
                script.src = "https://www.tiktok.com/embed.js";
                document.body.appendChild(script);
            }
        }

        function filterPosts(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderPosts();
        }

        function addPost() {
            const type = document.getElementById('mediaType').value;
            const url = document.getElementById('ytUrl').value.trim();
            const title = document.getElementById('postTitle').value.trim();
            const desc = document.getElementById('postDesc').value.trim();
            if (!url || !title) {
                alert('กรุณากรอกลิงก์วิดีโอและชื่อหัวข้อด้วยครับพี่!');
                return;
            }
            posts.unshift({ type, url, title, desc });
            localStorage.setItem('nextweb_posts', JSON.stringify(posts));
            document.getElementById('ytUrl').value = '';
            document.getElementById('postTitle').value = '';
            document.getElementById('postDesc').value = '';
            renderPosts();
            alert('เพิ่มเข้ารายการสถานีเรียบร้อยแล้วครับ!');
        }

        function deletePost(index) {
            if (confirm('ต้องการลบรายการรีวิวนี้ออกจากสถานีใช่ไหมครับ?')) {
                posts.splice(index, 1);
                localStorage.setItem('nextweb_posts', JSON.stringify(posts));
                renderPosts();
            }
        }

        function playAIVoice() {
            const text = document.getElementById('postDesc').value.trim();
            const btn = document.querySelector('.btn-ai-voice');
            if (!text) {
                alert('กรุณาพิมพ์บทพากย์ในช่องเนื้อหาก่อนกดฟังเสียงครับพี่!');
                return;
            }
            if (!('speechSynthesis' in window)) {
                alert('เบราว์เซอร์ในมือถือของคุณไม่รองรับระบบเสียงพูด AI ครับ');
                return;
            }

            window.speechSynthesis.cancel();

            const speak = () => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'th-TH';

                const voices = window.speechSynthesis.getVoices();
                const thVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('th'));
                if (thVoice) utterance.voice = thVoice;

                utterance.rate = 0.92;
                utterance.pitch = 0.75;
                utterance.volume = 1.0;

                btn.innerText = "🔊 กำลังพากย์เสียง...";
                utterance.onend = () => { btn.innerText = "🎙️ ฟังเสียงพากย์ AI (ฟรี)"; };
                utterance.onerror = () => { btn.innerText = "🎙️ ฟังเสียงพากย์ AI (ฟรี)"; };

                window.speechSynthesis.speak(utterance);
            };

            if (window.speechSynthesis.getVoices().length === 0) {
                window.speechSynthesis.onvoiceschanged = speak;
            } else {
                speak();
            }
        }

        function stopAIVoice() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
        }

        function checkAdminPassword() {
            let pass = prompt('กรุณากรอกรหัสผ่านแอดมิน:');
            if (pass === '44104545') {
                const panel = document.getElementById('adminPanel');
                if (panel.style.display === 'block') {
                    panel.style.display = 'none';
                    alert('ปิดระบบหลังบ้านแล้วครับ');
                } else {
                    panel.style.display = 'block';
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    alert('ยินดีต้อนรับท่านประธาน! เปิดระบบหลังบ้านสำเร็จ');
                }
            } else if (pass !== null) {
                alert('รหัสผ่านไม่ถูกต้องครับ!');
            }
        }

        renderPosts();
    </script>
</body>
</html>
